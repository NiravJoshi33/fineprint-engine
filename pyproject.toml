[project]
name = "fineprint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nirav Joshi", email = "niravjoshi3000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.14",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.1",
    "pymupdf==2.0",
    "pymupdf4llm==2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch==2.14.1",
]

[project.scripts]
fineprint = "fineprint:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
benchmark = [
    "docling>=2.150.0",
]

# Linux (the Lambda image) takes CPU-only torch: PyPI's Linux wheels pull in ~15 CUDA packages,
# GBs of GPU libraries a Lambda can't use. macOS keeps PyPI torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
